[package]
name = "pairpane_app"
description = "Pairpane: a thin Tauri shell over pairpane_core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "pairpane_app_lib"
path = "src/lib.rs"

[[bin]]
name = "pairpane"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
pairpane_core = { path = "../crates/pairpane_core" }
# The device link service the Devices screen drives (commands/devices); the async runtime is Tauri's own.
pairpane_link = { path = "../crates/pairpane_link" }
# SFTP sites (commands/remote); it owns its own async runtime, and every call blocks.
pairpane_remote = { path = "../crates/pairpane_remote" }
tokio.workspace = true
qrcodegen.workspace = true
# `generate_context!` embeds the `plugins` section of `tauri.conf.json` as `serde_json` values.
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-log.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-window-state.workspace = true
serde.workspace = true
getrandom.workspace = true
time.workspace = true
# `log` feature: tracing events from the core crate reach tauri-plugin-log (no subscriber is installed).
tracing = { workspace = true, features = ["log"] }

# The host name that this device is announced by (`uname`'s nodename), a safe API.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["system"] }

[dev-dependencies]
# An SSH server in this process for the tests of the remote commands.
pairpane_remote = { path = "../crates/pairpane_remote", features = ["test-server"] }
# Pictures to make thumbnails of (tests/thumb_helper.rs), encoded by the same crate that decodes them.
image.workspace = true
tempfile.workspace = true

[lints]
workspace = true
