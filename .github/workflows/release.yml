name: Release

# CI is the only go/no-go gate: this workflow runs no tests. It starts after CI succeeded for a push to main and
# releases exactly the commit CI tested. scripts/release.ts reads the Conventional Commits since the last tag
# (fix:/perf:/revert: -> patch, feat: -> minor, "feat!:" or a "BREAKING CHANGE:" footer -> major; other types do not
# release), bumps package.json/Cargo.toml/Cargo.lock and CHANGELOG.md; the job pushes the release commit and the
# vX.Y.Z tag and creates a DRAFT GitHub release. Then, each in its own job:
#   verify  - checks the release commit is exactly the CI-tested commit plus the version bump;
#   bundle  - builds the installers on every OS; read-only token, no secrets;
#   sign    - signs the updater artifacts; the only job with the signing key, runs nothing but the Tauri signer;
#   publish - verifies every signature against the committed public key, uploads everything, writes latest.json and
#             checksums.txt and only then publishes the release.
# A failure anywhere leaves a draft, which install.sh and the updater never see. See docs/release-and-updater-keys.md.
on:
  workflow_run:
    workflows: [CI] # the CI workflow's `name`; renaming it silently breaks this chain
    types: [completed]
    branches: [main]

# Releases run one at a time and are never cancelled half-way (a cancelled run could leave a tag without bundles).
# Runs that will not release (failed CI, pull requests) get their own group, so they never displace a pending release.
concurrency:
  group: >-
    ${{ (github.event.workflow_run.conclusion == 'success'
    && github.event.workflow_run.event == 'push'
    && github.event.workflow_run.head_branch == 'main'
    && github.event.workflow_run.head_repository.full_name == github.repository)
    && 'release' || format('release-skip-{0}', github.run_id) }}
  cancel-in-progress: false

permissions: {}

env:
  BUN_VERSION: 1.4.2

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Version and draft release
    # workflow_run also fires for CI runs of pull requests from forks (in this repository's context, with secrets),
    # and a fork's branch can be called main: require a successful push run of this repository's main.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the release commit + tag, create the draft release
    outputs:
      # Empty when nothing was released.
      released: ${{ steps.version.outputs.released }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      # (A failed push or draft fails the job, so the later jobs never run on a release that was not pushed.)
    # This job holds a write token, so it runs no third-party package code: only git, gh, jq and the repository's own
    # scripts/release.ts (from the commit CI tested) under the verified Bun. No `bun install`.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }} # the commit CI validated
          fetch-depth: 0 # the full history and tags, to find the last release
          persist-credentials: false # the push below passes the token explicitly, for that one command
      - name: The commit is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse HEAD) is not on main; refusing to release it."
            exit 1
          fi
      # Runs before any tag exists: a release without the updater public key and its signing secret would install
      # fine but could never update. Only whether the secret is set reaches this step, never its value.
      - name: Check the updater key is configured
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          pubkey=$(jq -r '.plugins.updater.pubkey // ""' src-tauri/tauri.conf.json)
          if [[ -z "$pubkey" || "$pubkey" == NOT_CONFIGURED* ]]; then
            echo "::error::plugins.updater.pubkey in src-tauri/tauri.conf.json is still the placeholder. See docs/release-and-updater-keys.md."
            exit 1
          fi
          if [[ "$HAS_SIGNING_KEY" != 'true' ]]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set. See docs/release-and-updater-keys.md."
            exit 1
          fi
      # Bun is downloaded and checked against pinned hashes before it runs. No caches anywhere in this workflow.
      - name: Install Bun (verified)
        run: .github/scripts/install-bun.sh
      # No token in this step: it only computes the version and makes the local commit and tag.
      - name: Version, changelog and tag
        id: version
        run: |
          # If main has moved on since, the newer push gets its own CI run and its own release run.
          if [[ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]]; then
            echo "::notice::main has moved on since this commit; the newer push releases."
            exit 0
          fi

          # --no-install: never fetch packages (there is no node_modules here); --no-env-file: ignore .env files.
          plan="$(bun --no-install --no-env-file scripts/release.ts next)"
          version="$(jq -r '.version // empty' <<< "$plan")"
          if [[ -z "$version" ]]; then
            echo "::notice::nothing to release since the last tag (no feat, fix, perf, revert or breaking change)."
            exit 0
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::scripts/release.ts proposed an invalid version"
            exit 1
          fi

          notes="$RUNNER_TEMP/notes.md"
          jq -r '.notes' <<< "$plan" > "$notes"
          bun --no-install --no-env-file scripts/release.ts apply "$version" "$notes"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json Cargo.toml Cargo.lock CHANGELOG.md
          git -c core.hooksPath=/dev/null commit -q -m "chore(release): $version [skip ci]"
          git tag "v$version"

          {
            echo "released=true"
            echo "version=$version"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      # Only git and gh see the token. The token goes to the push as a masked header, never into the git config.
      # --atomic: the commit and the tag land together or not at all (a tag without its commit on main would block
      # every later release).
      - name: Push the release commit and tag, create the draft release
        if: ${{ steps.version.outputs.released == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c core.hooksPath=/dev/null -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --atomic origin "HEAD:refs/heads/main" "refs/tags/v$VERSION"

          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  verify:
    name: Verify the release commit
    needs: release
    # success(): never run after a failed release job (its outputs are still set when the push failed).
    if: ${{ success() && needs.release.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 2 # the release commit and its parent
          persist-credentials: false
      # The release job pushes the release commit with a write token. Defense in depth: before anything from it is
      # built or trusted, this checks it is exactly the CI-tested commit plus the version
      # bump: each version file must equal the tested file with only the version replaced (CHANGELOG.md is free text
      # and read by nothing in the build). The check lives here, in the workflow file, because a workflow token
      # cannot change workflow files; a script from the release commit could be replaced by it.
      - name: The release commit is the tested commit plus the version bump
        env:
          SHA: ${{ needs.release.outputs.sha }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || fail "version '$VERSION' is not X.Y.Z"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ && "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "bad commit SHA"
          [[ "$(git rev-parse "$SHA^")" == "$TESTED_SHA" ]] || fail "release commit $SHA is not a child of the CI-tested commit $TESTED_SHA"
          while IFS= read -r file; do
            case "$file" in
              package.json | Cargo.toml | Cargo.lock | CHANGELOG.md) ;;
              *) fail "release commit changes $file; only the version files may change" ;;
            esac
          done < <(git diff --name-only "$TESTED_SHA" "$SHA")
          expect_bump() {
            if ! diff <(git show "$TESTED_SHA:$1" | awk -v v="$VERSION" "$2") <(git show "$SHA:$1"); then
              fail "$1 changes more than its version"
            fi
          }
          # shellcheck disable=SC2016 # an awk program, not shell
          expect_bump package.json '
            !done && /^  "version": "[^"]*",$/ { print "  \"version\": \"" v "\","; done = 1; next }
            { print }'
          # shellcheck disable=SC2016 # an awk program, not shell
          expect_bump Cargo.toml '
            /^\[/ { section = $0 }
            section == "[workspace.package]" && /^version = "[^"]*"$/ { print "version = \"" v "\""; next }
            { print }'
          # shellcheck disable=SC2016 # an awk program, not shell
          expect_bump Cargo.lock '
            /^\[\[package\]\]$/ { own = 0 }
            /^name = "pairpane_(core|link|app)"$/ { own = 1 }
            own && /^version = "[^"]*"$/ { print "version = \"" v "\""; own = 0; next }
            { print }'
          echo "release commit $SHA = $TESTED_SHA + version $VERSION"

  bundle:
    name: Bundle (${{ matrix.name }})
    needs: [release, verify]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read # no secrets and no write access while third-party build code runs
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 (AppImage, deb, rpm)
            id: linux-x64
            os: ubuntu-22.04 # oldest supported glibc, so the binaries run on older distributions too
            args: --bundles appimage,deb,rpm
          - name: macOS arm64
            id: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: macOS x64
            id: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            arch: x64
            args: --target x86_64-apple-darwin --bundles app,dmg
          - name: Windows x64 (NSIS, MSI)
            id: windows-x64
            os: windows-latest
            args: --bundles nsis,msi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }} # the verified release commit, not a name that could be re-pointed
          persist-credentials: false
      - name: The tag points at the release commit
        env:
          VERSION: ${{ needs.release.outputs.version }}
          SHA: ${{ needs.release.outputs.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
          if [[ "$(git rev-parse "refs/tags/v$VERSION^{commit}")" != "$SHA" ]]; then
            echo "::error::tag v$VERSION does not point at the release commit $SHA"
            exit 1
          fi
      - name: Install Linux system libraries
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libdbus-1-dev librsvg2-dev patchelf file
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Add Rust target
        if: ${{ matrix.target != '' }}
        run: rustup target add "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - name: Install Bun (verified)
        run: .github/scripts/install-bun.sh
      - run: bun install --frozen-lockfile --ignore-scripts
      # Always `tauri build` (custom-protocol feature on); a plain cargo build would load the dev server URL.
      # `-- --locked`: cargo uses exactly Cargo.lock.
      - name: Build the installers
        env:
          ARGS: ${{ matrix.args }}
        run: |
          # shellcheck disable=SC2086 # ARGS holds several flags on purpose
          bun tauri build $ARGS -- --locked
      # HEIC is decoded by the system's libheif only (no HEVC decoder of our own). The AppImage's RUNPATH would make a
      # bundled copy win over the system one, so none may be in it, nor a library its plugins could decode HEVC with.
      - name: The AppImage bundles no HEIF or HEVC decoder
        if: ${{ runner.os == 'Linux' }}
        run: |
          appimage="$(ls target/release/bundle/appimage/*.AppImage)"
          scratch="$(mktemp -d)"
          (cd "$scratch" && "$OLDPWD/$appimage" --appimage-extract >/dev/null)
          found="$(find "$scratch/squashfs-root" \( -name 'libheif*' -o -name 'libde265*' -o -name 'libavcodec*' \
            -o -name 'libgstlibav*' \) -print)"
          rm -rf "$scratch"
          if [[ -n "$found" ]]; then
            echo "::error::the AppImage bundles a HEIF/HEVC library: $found"
            exit 1
          fi
      # Collects the installers under fixed names. macOS updates use the .app as a .tar.gz, made here.
      - name: Collect the installers
        env:
          VERSION: ${{ needs.release.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir dist
          case "$RUNNER_OS" in
            Linux)
              cp target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb \
                target/release/bundle/rpm/*.rpm dist/
              ;;
            macOS)
              bundle="target/$TARGET/release/bundle"
              cp "$bundle"/dmg/*.dmg dist/
              COPYFILE_DISABLE=1 tar -czf "dist/Pairpane_${VERSION}_${ARCH}.app.tar.gz" -C "$bundle/macos" Pairpane.app
              ;;
            Windows)
              cp target/release/bundle/msi/*.msi target/release/bundle/nsis/*-setup.exe dist/
              ;;
          esac
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.id }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign updater artifacts
    needs: [release, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job with the signing key. It runs nothing from the repository or from the release commit (written by
    # a job with a write token): only what this workflow file pins, which a workflow token cannot change.
    permissions: {}
    outputs:
      # check downloads exactly this artifact: a replaced one gets a new id and is not found.
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      # One directory per build leg, by exact name, so one leg cannot overwrite or add another platform's files.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-linux-x64
          path: legs/linux-x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-macos-aarch64
          path: legs/macos-aarch64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-macos-x64
          path: legs/macos-x64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-windows-x64
          path: legs/windows-x64
      # Every leg must contain exactly its expected files; only those are signed and published.
      - name: Check the installers
        run: |
          expect() {
            local leg="$1"; shift
            if ! diff <(find "legs/$leg" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort) <(printf '%s\n' "$@" | sort); then
              echo "::error::legs/$leg does not contain exactly the expected files"
              exit 1
            fi
          }
          v="$VERSION"
          expect linux-x64 "Pairpane_${v}_amd64.AppImage" "Pairpane_${v}_amd64.deb" "Pairpane-${v}-1.x86_64.rpm"
          expect macos-aarch64 "Pairpane_${v}_aarch64.dmg" "Pairpane_${v}_aarch64.app.tar.gz"
          expect macos-x64 "Pairpane_${v}_x64.dmg" "Pairpane_${v}_x64.app.tar.gz"
          expect windows-x64 "Pairpane_${v}_x64_en-US.msi" "Pairpane_${v}_x64-setup.exe"
          mkdir dist
          mv legs/*/* dist/
      # The Tauri CLI 2.12.6 packages, checked against the SHA-512 integrity in bun.lock before they are unpacked,
      # and run with the runner image's Node. Bump these together with @tauri-apps/cli in package.json.
      - name: Install the Tauri signer (verified)
        run: |
          install_pkg() {
            local name="$1" url="$2" integrity="$3" dir="$RUNNER_TEMP/signer/node_modules/$1"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/pkg.tgz" "$url"
            actual="sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/pkg.tgz" | base64 -w0)"
            if [[ "$actual" != "$integrity" ]]; then
              echo "::error::$name has integrity $actual, expected $integrity"
              exit 1
            fi
            mkdir -p "$dir"
            tar -xzf "$RUNNER_TEMP/pkg.tgz" -C "$dir" --strip-components=1
          }
          install_pkg @tauri-apps/cli \
            https://registry.npmjs.org/@tauri-apps/cli/-/cli-2.12.6.tgz \
            "sha512-/cOeQgqq8PBDPODOjjT0YHs4qxKCHcQMWMiBm4rLM3JNr9mZE+PHNKOK4zAkhIUtYMNL/0fweW48VNvzD1AbqA=="
          install_pkg @tauri-apps/cli-linux-x64-gnu \
            https://registry.npmjs.org/@tauri-apps/cli-linux-x64-gnu/-/cli-linux-x64-gnu-2.12.6.tgz \
            "sha512-ZAb4/CHRma3ErjL2RGfHjITTUBIs4zySf0hIli9BddOtEdSx0ze0hEgxl+HfBVc5OEW/QmbiZ2E2+CkkHc8Pcg=="
      - name: Sign the updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          v="$VERSION"
          for name in "Pairpane_${v}_amd64.AppImage" "Pairpane_${v}_amd64.deb" "Pairpane-${v}-1.x86_64.rpm" \
            "Pairpane_${v}_aarch64.app.tar.gz" "Pairpane_${v}_x64.app.tar.gz" \
            "Pairpane_${v}_x64_en-US.msi" "Pairpane_${v}_x64-setup.exe"; do
            node "$RUNNER_TEMP/signer/node_modules/@tauri-apps/cli/tauri.js" signer sign --app-version "$v" "dist/$name" \
              >/dev/null
          done
          ls -l dist
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: dist/
          if-no-files-found: error
          retention-days: 7

  check:
    name: Check the signed release files
    needs: [release, verify, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Read-only: the checks install minisign from apt (as root), so they run apart from the write token.
    permissions:
      contents: read
    outputs:
      # publish downloads exactly this artifact (a replaced one gets a new id) and checks it against this hash.
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      checksums: ${{ steps.hash.outputs.checksums }}
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }} # verified: tauri.conf.json (the public key) is the CI-tested one
          persist-credentials: false
      # Without an id the action would download every artifact of the run: refuse instead.
      - name: The signed artifact id is known
        env:
          ARTIFACT_ID: ${{ needs.sign.outputs.artifact-id }}
        run: '[[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || { echo "::error::no artifact id from sign"; exit 1; }'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact-id }}
          path: dist
      # Exact file list, every signature bound to the committed public key, file name and version; then
      # latest.json and checksums.txt. From the verified release commit (CI-tested plus the version bump only).
      - name: Check the files and signatures, write latest.json and checksums.txt
        run: .github/scripts/check-release-files.sh
      - id: hash
        run: echo "checksums=$(sha256sum < dist/checksums.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [release, check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only step with a write token here: download the checked files, upload them, publish. Nothing else runs.
    permissions:
      contents: write # upload the assets, un-draft the release
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      # Without an id the action would download every artifact of the run: refuse instead.
      - name: The checked artifact id is known
        env:
          ARTIFACT_ID: ${{ needs.check.outputs.artifact-id }}
        run: '[[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || { echo "::error::no artifact id from check"; exit 1; }'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.check.outputs.artifact-id }}
          path: dist
      # Exactly the files check verified: checksums.txt is the one check hashed, every file matches it, nothing else.
      - name: The files are the checked ones
        env:
          CHECKSUMS: ${{ needs.check.outputs.checksums }}
        run: |
          if [[ -z "$CHECKSUMS" || "$(sha256sum < dist/checksums.txt | cut -d' ' -f1)" != "$CHECKSUMS" ]]; then
            echo "::error::checksums.txt is not the one the check job wrote"
            exit 1
          fi
          (cd dist && sha256sum --quiet --strict -c checksums.txt)
          if ! diff <(find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | grep -vxF checksums.txt | sort) \
            <(sed 's/^[0-9a-f]\{64\}  //' dist/checksums.txt | sort); then
            echo "::error::the downloaded files are not exactly the checked ones"
            exit 1
          fi
      - name: Upload to the draft release and publish it as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
