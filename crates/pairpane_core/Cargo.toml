[package]
name = "pairpane_core"
description = "Core of Pairpane (no Tauri dependency)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
base64.workspace = true
blake3.workspace = true
fs4.workspace = true
minisign-verify.workspace = true
notify.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
ts-rs.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# The freedesktop Trash is done in pairpane_core::ops::trash::freedesktop on these systems.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
jiff.workspace = true

# Elsewhere the system does the Trash, through the crate.
[target.'cfg(not(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android")))))'.dependencies]
trash.workspace = true

[target.'cfg(windows)'.dependencies]
same-file.workspace = true
sysinfo.workspace = true

[dev-dependencies]
criterion.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true

[[bench]]
name = "listing"
harness = false

[lints]
workspace = true
