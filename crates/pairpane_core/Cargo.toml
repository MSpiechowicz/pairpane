[package]
name = "pairpane_core"
description = "Core of Pairpane (no Tauri dependency)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
aes.workspace = true
base64.workspace = true
bzip2.workspace = true
blake3.workspace = true
chardetng.workspace = true
crc32fast.workspace = true
ctr.workspace = true
encoding_rs.workspace = true
flate2.workspace = true
fs4.workspace = true
gix.workspace = true
getrandom.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
hmac.workspace = true
ignore.workspace = true
image.workspace = true
# The local time of a file's modification for the date placeholders of a rename (pairpane_core::rename), and of a
# `.trashinfo` record. Windows has no zoneinfo files, so the database is bundled there.
jiff = { workspace = true, features = ["tzdb-bundle-platform"] }
lzma-rust2.workspace = true
md-5.workspace = true
memchr.workspace = true
minisign-verify.workspace = true
notify.workspace = true
pbkdf2.workspace = true
pulldown-cmark.workspace = true
regex.workspace = true
rayon.workspace = true
ruzstd.workspace = true
serde.workspace = true
serde_json.workspace = true
sevenz-rust2.workspace = true
sha1.workspace = true
sha2.workspace = true
tar.workspace = true
tracing.workspace = true
ts-rs.workspace = true
zeroize.workspace = true
zstd.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true
uzers.workspace = true

# The HEIC helper process confines itself on Linux (view::heic::sandbox).
[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
libc.workspace = true

# The thumbnail helper confines itself on macOS (view::thumb::macos): the sandbox's C interface and `close`.
[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

# The freedesktop Trash is done in pairpane_core::ops::trash::freedesktop on these systems.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
libloading.workspace = true

# Elsewhere the system does the Trash, through the crate.
[target.'cfg(not(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android")))))'.dependencies]
trash.workspace = true

[target.'cfg(windows)'.dependencies]
same-file.workspace = true
sysinfo.workspace = true
winapi-util.workspace = true
windows.workspace = true
windows-sys.workspace = true

[dev-dependencies]
criterion.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true

[[bench]]
name = "listing"
harness = false

[lints]
workspace = true
