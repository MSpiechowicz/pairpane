# cargo-deny policy: `cargo deny check advisories bans licenses sources`.

[advisories]
yanked = "deny"
ignore = [
  # Unmaintained, pulled in only by Tauri's Linux GTK3 bindings (glib-macros); no fix available.
  { id = "RUSTSEC-2024-0370", reason = "transitive via tauri -> gtk3 stack; unmaintained, no vulnerability" },
  # Unmaintained, pulled in by Tauri's D-Bus plugins (opener, single-instance) through zbus; no fix available.
  { id = "RUSTSEC-2026-0370", reason = "zvariant, transitive via tauri plugins -> zbus; unmaintained, no vulnerability" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names, transitive via tauri plugins -> zbus; unmaintained, no vulnerability" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, transitive via tauri plugins -> zbus; unmaintained, no vulnerability" },
  # cookie 0.18: private cookie nonces can repeat after a fork. Pulled in only by tauri, tauri-runtime and wry, which
  # require ^0.18; the app never uses cookie's PrivateJar. Drop this once Tauri moves to a fixed cookie.
  { id = "RUSTSEC-2026-0594", reason = "cookie 0.18, transitive via tauri/wry (^0.18); PrivateJar is never used by the app" },
  # chrono is unmaintained; informational, no patched version, no vulnerability. Netwatch (iroh's interface watcher) depends
  # on it directly for Windows and wmi needs it by default, so no feature switch removes it.
  { id = "RUSTSEC-2026-0543", reason = "chrono, transitive via iroh -> netwatch -> wmi (Windows interface watching); unmaintained, no vulnerability" },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  # zstd-sys (the C libzstd that writes `.tar.zst`): "BSD-3-Clause AND BSD-2-Clause", both permissive and compatible with
  # the GPL.
  "BSD-2-Clause",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "0BSD",
  # ring, rustls-webpki, untrusted and libloading, when a dependency brings a TLS stack.
  "ISC",
  # webpki-root-certs: the Mozilla root certificates as data.
  "CDLA-Permissive-2.0",
  # libbz2-rs-sys (the pure Rust bzip2 behind the `bzip2` crate): the permissive BSD-style licence of bzip2 and libbzip2,
  # compatible with the GPL.
  "bzip2-1.0.6",
  # Our own workspace crates.
  "GPL-3.0-or-later",
]

# async_io_stream, pharos and ws_stream_wasm, which iroh-relay lists for WebAssembly builds only (never compiled for the
# desktop app). The Unlicense is a public domain dedication, compatible with the GPL; it is allowed for these crates only.
[[licenses.exceptions]]
crate = "async_io_stream"
allow = ["Unlicense"]

[[licenses.exceptions]]
crate = "pharos"
allow = ["Unlicense"]

[[licenses.exceptions]]
crate = "ws_stream_wasm"
allow = ["Unlicense"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
