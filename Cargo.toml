# Workspace root: the pairpane_core crate and the thin Tauri shell.
[workspace]
resolver = "3"
members = ["crates/pairpane_core", "src-tauri"]

[workspace.package]
version = "0.32.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/MSpiechowicz/pairpane"
rust-version = "1.98"

[workspace.lints.rust]
# Denied, not forbidden: the few modules that call into the system (`pairpane_core::ops::win_attrs`, the `ReplaceFileW`
# call of `pairpane_core::edit::win_replace` and the HEIC decoders of `pairpane_core::view::heic`) allow it, each with a reason and a `SAFETY` comment on every block.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Pinned once here; member crates use `name.workspace = true`.
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
tracing = "0.1.44"
# Desktop shell (Tauri 2 only; Tauri 3 alpha is not used).
tauri = "2.12.2"
tauri-build = "2.7.1"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-opener = "2.7.0"
tauri-plugin-log = "2.10.0"
# Native confirmation before an external editor program is started (src-tauri/src/commands/edit); shown from Rust only, no
# dialog permission is granted to the webview.
tauri-plugin-dialog = "2.8.4"
# Updater public-key validation (pairpane_core::update). Kept on the versions tauri-plugin-updater uses,
# so the app accepts exactly the keys the updater can verify signatures with.
base64 = "0.23"
minisign-verify = "0.3"
# Formats the release date of an announced update (RFC 3339); already in the lockfile through Tauri.
time = { version = "0.3.55", features = ["formatting"] }
# Signed in-app updates over TLS (HTTPS only; see src-tauri/src/commands/updates.rs).
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
# Folder listings (pairpane_core::listing): parallel metadata reads and debounced change watching.
rayon = "1.12.0"
notify = "8.2.0"
# Free space of the volume a folder is on (`fs4::available_space`: statvfs / GetDiskFreeSpaceExW); a safe API.
fs4 = "1.1.0"
# Lists the local volumes on Windows (`sysinfo::Disks`): FindFirstVolumeW with only fixed and removable drives kept,
# so a mapped network drive is never listed or touched. A safe API; only the `disk` feature is built.
sysinfo = { version = "0.40", default-features = false, features = ["disk"] }
# File copy and move (pairpane_core::ops): BLAKE3 to verify a copy and to compare two files (a safe API; its SIMD code
# is built with the `cc` build dependency that is in the lockfile already), and rustix (Unix only) for the fast paths and
# the no-replace rename (reflink, copy_file_range, fclonefileat, renameat2), all without `unsafe`. The `process` feature
# is for `getuid`: the Trash folders must belong to the user (pairpane_core::ops::trash).
blake3 = { version = "1.8.7", default-features = false, features = ["std"] }
rustix = { version = "1.1.6", default-features = false, features = ["fs", "process", "std", "thread"] }
# Checksum files and file splitting (pairpane_core::ops): SHA-256 and MD5 (RustCrypto, both on digest 0.10, safe Rust)
# next to the BLAKE3 above, a CRC-32 for the `.crc` file of a split (Total Commander's format), and, on Unix only, the
# names of a file's owner and group (`uzers`, a safe wrapper of getpwuid_r and getgrgid_r).
sha2 = { version = "0.10.9", default-features = false }
md-5 = { version = "0.10.6", default-features = false }
crc32fast = { version = "1.5.5", default-features = false, features = ["std"] }
uzers = { version = "0.12.2", default-features = false, features = ["cache"] }
# Unicode normalisation (NFC) for the names of folders that a case-insensitive file system (macOS) reads as one (pairpane_core::gitstatus::names);
# already in the lockfile through gix-utils.
unicode-normalization = { version = "0.1.26", default-features = false }
# Windows only: the identity of a file or folder (volume serial number and file index, from a handle the caller opens
# without following links), so two spellings of one place (8.3 names, case, a volume GUID path) compare equal. A safe
# API over `winapi-util`; both are in the lockfile already through `walkdir`.
same-file = "1.0.6"
# Windows only: the plain (volume serial number, file index) of a folder read through a handle that is closed at once
# (pairpane_core::ops::identity::FolderId), for what must be remembered without keeping a handle open. The version
# `same-file` already locks.
winapi-util = "0.1.11"
# Windows only: setting the hidden, system and archive attributes through a handle (`SetFileInformationByHandle`, an
# `unsafe` block in pairpane_core::ops::win_attrs), the Job Object that holds the HEIC helper process
# (pairpane_core::view::heic::job) and the AppContainer the thumbnail helper runs in (pairpane_core::view::thumb::
# appcontainer: the container's profile and SID, the access list entry for it on the executable, `CreateProcessW` with an
# attribute list and the pipes). Only the features those calls need; already in the lockfile through other dependencies.
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }
# Move to the Trash or Recycle Bin and put back (pairpane_core::ops::trash): the shell's IFileOperation on Windows,
# Finder on macOS (which has no list or restore here, so no undo). A safe API. Not built on Linux and the BSDs, which
# do the freedesktop Trash themselves (the crate follows links, copies across disks and panics on odd mount names).
trash = "5.4.0"
# The local time of a `.trashinfo` record (`DeletionDate`) on Linux and the BSDs; the version the lockfile has through
# `trash` (MIT or Unlicense). Only the system time zone is read: `std`, `tz-system` and `tzdb-zoneinfo`.
jiff = { version = "1.0.1", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# The file viewer (pairpane_core::view), all safe APIs. `encoding_rs` decodes the text encodings of the web and `chardetng`
# guesses one from a sample (no multi-threading); `pulldown-cmark` parses Markdown into a tree the webview draws itself (no
# HTML is ever produced, so its HTML renderer is off); `tar` lists the entries of a tar and `flate2` (the pure Rust
# zlib-rs backend) inflates a `.tar.gz` for that listing, never to disk; `memchr` finds the newlines and the search text
# in a chunk quickly. A zip's central directory is read by pairpane_core::archive::zip::directory itself, not by a zip
# crate, which sizes its tables from counts a crafted file declares.
encoding_rs = "0.8.44"
chardetng = { version = "1.0.0", default-features = false }
pulldown-cmark = { version = "0.13.6", default-features = false }
tar = { version = "0.4.46", default-features = false }
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
memchr = "2.8.3"
# Thumbnails (pairpane_core::view::thumb): the pure Rust decoders of the formats the web knows, run only in the sandboxed
# helper process that answers a thumbnail, never in the app's own process (the picture is untrusted), and the box
# filter that shrinks a picture. No default features: no threads (`rayon`), no other format (AVIF, TIFF, EXR and the
# rest are never decoded), and the decoders are `png`, `zune-jpeg`, `gif` and `image-webp`.
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
# Random bytes from the system's generator, a safe API that returns an error instead of panicking: the tokens of the
# viewer's media scheme (pairpane-media, src-tauri/src/commands/view; 128 bits, so a page cannot guess one) and the salts
# and initialisation vectors of an encrypted archive that is written (pairpane_core::archive::write). Already in the
# lockfile through tauri's own dependencies.
getrandom = "0.4.3"
# HEIC pictures are decoded by the codecs the system has, never by a codec shipped with the app (HEVC is patent-encumbered).
# Linux and the BSDs: `libloading` opens the system's libheif at run time (pairpane_core::view::heic::libheif), so the
# app neither links nor ships it. The version the lockfile has through tauri's tray dependency (one copy, not two); its
# `Library::new` and `get` are `unsafe`.
libloading = "0.7.4"
# Windows only: the Windows Imaging Component (pairpane_core::view::heic::wic), whose HEIF codec is the user's HEIF and
# HEVC Image Extensions. Only the features that call chain needs; the version the lockfile has through sysinfo and tauri.
windows = { version = "0.62.2", default-features = false, features = ["std", "Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com"] }
# The helper process that decodes a HEIC picture confines itself on Linux (pairpane_core::view::heic::sandbox): Landlock
# with every filesystem and network right denied, a safe API over the kernel's three syscalls. Its other dependencies
# (`libc`, `enumflags2`, `thiserror`) are in the lockfile already. `rustix` (above) sets the other limits.
landlock = "0.4.8"
# The same helper's seccomp filter, the descriptors it closes at its start and the probe of Landlock's version are raw
# system calls (pairpane_core::view::heic::kernel, Linux only, `unsafe` with a `SAFETY` comment on every block); on macOS
# the thumbnail helper closes its descriptors with it (pairpane_core::view::thumb::macos). The version the lockfile has
# already through `landlock` (one copy, not two).
libc = "0.2.191"
# Archives (pairpane_core::archive), all safe APIs, none of them reading a file by itself: the archive code hands each
# decoder a bounded reader, and bytes that come from an archive are decoded by pure Rust only. `bzip2` (the libbz2-rs-sys
# backend, no C library) and `ruzstd` (the decoder only; its encoder is used by the tests) are the codecs of a bzip2 or
# zstd entry in a zip and of `.tar.bz2` and `.tar.zst`; `lzma-rust2` reads the XZ container of `.tar.xz` and writes the
# LZMA2 stream of a 7z (the same copy `sevenz-rust2` uses). Its `encoder` feature is for packing. libbz2-rs-sys is
# licensed `bzip2-1.0.6` (see deny.toml).
bzip2 = "0.6.1"
ruzstd = "0.9.1"
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "xz", "optimization", "encoder"] }
# Packing writes `.tar.zst` with the C library libzstd (`zstd-safe` is the safe API over `zstd-sys`; BSD-2-Clause or
# BSD-3-Clause, see deny.toml): the encoder is used only for bytes of our own, never for those of an archive, which
# `ruzstd` decodes. No default features: no legacy formats, no bindgen, no pkg-config.
zstd = { version = "0.14.4", default-features = false }
# 7z archives (pairpane_core::archive::sevenz, and the writer in `archive::write`). Only what the format needs: the
# AES-256 of encrypted content and headers, bzip2 and deflate next to the LZMA family it always has, and the `compress`
# feature (the encoders) to write them. Not the C `zstd`, brotli, lz4, nor PPMd.
sevenz-rust2 = { version = "0.25.0", default-features = false, features = ["aes256", "bzip2", "deflate", "compress"] }
# WinZip AES entries of a zip (AES-128 and AES-256, AE-1 and AE-2): PBKDF2-HMAC-SHA1, AES in counter mode and an HMAC-SHA1
# tag. On the RustCrypto generation `sevenz-rust2` uses (`aes` 0.9, digest 0.11), so there is one copy of `aes`, `cipher`
# and `digest` of that generation; the `sha2` 0.10 above stays on digest 0.10 for the checksum files.
aes = "0.9.4"
ctr = "0.10.1"
hmac = "0.13.0"
sha1 = { version = "0.11.0", default-features = false }
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
# Archive passwords are kept in memory only and overwritten when dropped; already in the lockfile.
zeroize = "1.9.2"
# Find files (pairpane_core::find), ripgrep's own libraries, all safe APIs: `ignore` walks a folder tree on threads of its
# own (`build_parallel`; a link is never followed, `.gitignore` files are read by `globset`), `grep-searcher` searches a
# file's content with a bounded heap (`heap_limit`, binary files quit on the first NUL, a decoder for UTF-16 and the
# encodings of the viewer) and `grep-regex` builds its matcher on `regex-automata` with a size limit. `regex` is named here
# for the name patterns of a search, built with the same limits; it is the copy the lockfile has (one copy of
# `regex-automata` and `regex-syntax`). Memory-mapped files are never used (`MmapChoice` stays `never`; mapping a file
# that changes is `unsafe`). The three ripgrep crates are Unlicense OR MIT, `regex` is MIT OR Apache-2.0.
ignore = "0.4.34"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
regex = "1.13.2"
# The git status column (pairpane_core::gitstatus): gitoxide, pure Rust, in process; the `git` program is never run, and the
# repositories read are untrusted, so the trust model in that module's docs applies. No default features (no network
# client, no credentials, no revision machinery, no extras): `status` (index against HEAD and the work tree, with the
# directory walk and the ignore rules) and `sha1` (object ids). MIT OR Apache-2.0.
gix = { version = "0.91.0", default-features = false, features = ["status", "sha1"] }
# Dev dependencies
pretty_assertions = "1.4"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3.27.0"

# Default codegen units and no cross-crate LTO: the release bundles compile in about half the time, and an app
# that mostly waits on the webview gains nothing measurable from the slower settings.
[profile.release]
opt-level = 3
strip = true
