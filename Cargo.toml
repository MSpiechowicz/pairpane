# Workspace root: the pairpane_core crate and the thin Tauri shell.
[workspace]
resolver = "3"
members = ["crates/pairpane_core", "src-tauri"]

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/MSpiechowicz/pairpane"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Pinned once here; member crates use `name.workspace = true`.
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
tracing = "0.1.44"
# Desktop shell (Tauri 2 only; Tauri 3 alpha is not used).
tauri = "2.12.2"
tauri-build = "2.7.1"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-opener = "2.7.0"
tauri-plugin-log = "2.10.0"
# Updater public-key validation (pairpane_core::update). Kept on the versions tauri-plugin-updater uses,
# so the app accepts exactly the keys the updater can verify signatures with.
base64 = "0.23"
minisign-verify = "0.3"
# Formats the release date of an announced update (RFC 3339); already in the lockfile through Tauri.
time = { version = "0.3.55", features = ["formatting"] }
# Signed in-app updates over TLS (HTTPS only; see src-tauri/src/commands/updates.rs).
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
# Folder listings (pairpane_core::listing): parallel metadata reads and debounced change watching.
rayon = "1.12.0"
notify = "8.2.0"
# Free space of the volume a folder is on (`fs4::available_space`: statvfs / GetDiskFreeSpaceExW); a safe API.
fs4 = "1.1.0"
# Lists the local volumes on Windows (`sysinfo::Disks`): FindFirstVolumeW with only fixed and removable drives kept,
# so a mapped network drive is never listed or touched. A safe API; only the `disk` feature is built.
sysinfo = { version = "0.40", default-features = false, features = ["disk"] }
# File copy and move (pairpane_core::ops): BLAKE3 to verify a copy and to compare two files (a safe API; its SIMD code
# is built with the `cc` build dependency that is in the lockfile already), and rustix (Unix only) for the fast paths and
# the no-replace rename (reflink, copy_file_range, fclonefileat, renameat2), all without `unsafe`. The `process` feature
# is for `getuid`: the Trash folders must belong to the user (pairpane_core::ops::trash).
blake3 = { version = "1.8.7", default-features = false, features = ["std"] }
rustix = { version = "1.1.6", default-features = false, features = ["fs", "process", "std"] }
# Checksum files and file splitting (pairpane_core::ops): SHA-256 and MD5 (RustCrypto, both on digest 0.10, safe Rust)
# next to the BLAKE3 above, a CRC-32 for the `.crc` file of a split (Total Commander's format), and, on Unix only, the
# names of a file's owner and group (`uzers`, a safe wrapper of getpwuid_r and getgrgid_r).
sha2 = { version = "0.10.9", default-features = false }
md-5 = { version = "0.10.6", default-features = false }
crc32fast = { version = "1.5.5", default-features = false, features = ["std"] }
uzers = { version = "0.12.2", default-features = false, features = ["cache"] }
# Windows only: the identity of a file or folder (volume serial number and file index, from a handle the caller opens
# without following links), so two spellings of one place (8.3 names, case, a volume GUID path) compare equal. A safe
# API over `winapi-util`; both are in the lockfile already through `walkdir`.
same-file = "1.0.6"
# Move to the Trash or Recycle Bin and put back (pairpane_core::ops::trash): the shell's IFileOperation on Windows,
# Finder on macOS (which has no list or restore here, so no undo). A safe API. Not built on Linux and the BSDs, which
# do the freedesktop Trash themselves (the crate follows links, copies across disks and panics on odd mount names).
trash = "5.4.0"
# The local time of a `.trashinfo` record (`DeletionDate`) on Linux and the BSDs; the version the lockfile has through
# `trash` (MIT or Unlicense). Only the system time zone is read: `std`, `tz-system` and `tzdb-zoneinfo`.
jiff = { version = "1.0.1", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# Dev dependencies
pretty_assertions = "1.4"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3.27.0"

# Default codegen units and no cross-crate LTO: the release bundles compile in about half the time, and an app
# that mostly waits on the webview gains nothing measurable from the slower settings.
[profile.release]
opt-level = 3
strip = true
